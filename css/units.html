<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="units.css">
    <title>Document</title>
    <style>
        html{
            font-size: 20px;
        }

        .box{
            width: 50%;
            height: 100px;
            background-color: green;
        }

        h1{
            font-size: 2rem;
        }
    </style>
</head>

<body>
    <div class="box"></div>
    <div>
        <h1>CSS Units</h1>
        <!-- Giá trị tuyệt đối -->
        <h2>1. Absolute units?</h2> 
        <ul>
            <li>px</li>
            <li>pt</li>
            <li>cm</li>
            <li>mm</li>
            <li>inch</li>
            <li>pc</li>
        </ul>
        <!-- Giá trị tương đối -->
        <h2>2. Relative units?</h2>
        <ul>
            <li>%</li>
            <!-- phụ thuộc vào thẻ html -->
            <li>rem</li>
            <li>em</li>
            <!-- viewport -->
            <li>vw</li>
            <li>vh</li>
            <li>vmin</li>
            <li>vmax</li>
            <li>ex</li>
            <li>ch</li>
        </ul>
    </div>
</body>

</html>
