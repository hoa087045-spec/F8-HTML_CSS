<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html,
        body {
            margin: 0;
        }

        h1 {
            /* position: relative; */
            /* top: 100px; */
            /* thêm pos thì nó sẽ đè lên cả chữ */

            padding: 0 16px;
            color: #fff;
            background-color: #333;
            position: sticky;
            position: -webkit-sticky;
        }

        /* .box{
            width: 100%;
            height: 120px;
            background-color: #333;
            position: relative;
        } */
         
        .box-child {
            /* background-color: rgba(255, 255, 255, 0.5); */
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            left: 0;
        }

        /* phụ thuộc vào pos của thẻ cha gần nhất */

        .header {
            width: 100%;
            height: 120px;
            background-color: #24ffd7;
            position: fixed;
        }
    </style>
</head>

<body>
    <div class="header"></div>
    <div class="box">
        <div class="box-child"></div>
    </div>
    <h1>Position</h1>
    <ul>
        <li>Relative</li>
        <!-- vị trí Re tương đối, không bị phụ thuộc -->
        <li>Absolute</li>
        <!-- dùng để đè đè lên 1 lớp -->
        <li>Fixed</li>
        <!-- cố định trên trình duyệt -->
        <li>Sticky</li>
    </ul>
</body>

</html>
