<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .header {
            width: 100%;
            height: 100vh;
            /* thêm hình thì thêm url */
            /* mặc định là repeat */
            background-image: url(https://hoanghamobile.com/tin-tuc/wp-content/uploads/2023/07/hinh-dep.jpg), url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSHfMzFlCZrfHtbiFVuVvTk1a85Bz41N_ke1dyh8e6HPQ&s=10);
            background-size: contain;
            /* contain lấy kích thước dài để hiển thị*/
            background-repeat: no-repeat;
            border: 20px dashed #ccc;
            padding: 20px;
            /* đổ border từ ảnh thay vì viền ngoài */
            background-origin: border-box;
            background-position: bottom right;
            /* độ chuyển màu background */
            /* có thể dùng rgba để thấy trong suốt */
            /* background-image: linear-gradient(90deg, #333, #fff); */
            /* background: url(https://hoanghamobile.com/tin-tuc/wp-content/uploads/2023/07/hinh-dep.jpg) no-repeat center / contain; gộp chung*/
        }
    </style>
</head>

<body>
    <div class="header"></div>
</body>

</html>
