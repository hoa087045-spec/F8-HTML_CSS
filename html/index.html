<!DOCTYPE html>
<html>

<head>
    <title>F8-Shop</title>
    <meta charset="utf-8">
</head>

<body>
    <!-- Phần thân -->
    <!-- CTRL + / để ra phím tắt cmt -->
    <!-- 
            1. h1 - h6 - heading
            2. p - paragragh
            3. img - image
            4. a - anchor
            5. ul, li - unordered list, list item
            6. table 
            7. input 
            8. button 
            9. div 
        -->
    Xin chao cac ban
    <img src="link ảnh" alt="tên ảnh khi không load được ảnh">
    <a href="link web">tên web trỏ tới</a>
    <ul>
        <li></li>
        <li></li>
    </ul>
    <input type="checkbox">
    <input type="radio">
    <button>Đăng nhập</button>
    <div>
        <table>
            <!-- th or td có thể * (số thẻ muốn tạo) td*3 -->
            <thead>
                <!-- table head -->
                <th>
                    <!-- table heading -->
                    STT
                </th>
                <th>
                    Tên
                </th>
                <th>
                    Địa chỉ
                </th>
            </thead>
            <tbody>
                <!-- table body -->
                <tr>
                    <!-- table row -->
                    <td>1</td>
                    <td>2</td>
                    <td>3</td>
                </tr>
                <tr>
                    <!-- table row -->
                    <td>4</td>
                    <td>5</td>
                    <td>6</td>
                </tr>
            </tbody>
        </table>
    </div>
    <h1 title="Tiêu đề">Attribute</h1> 
    <!-- title, onlick là 1 attribute -->
</body>

</html>
